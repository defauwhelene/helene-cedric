  :root {
    --cream: #FAF7E3;
    --green: #4D6D40;
    --green-deep: #3B5530;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--cream);
    color: var(--green);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
    text-align: center;
  }
  main { max-width: 26rem; width: 100%; }
  .butterfly { width: 88px; height: auto; display: block; margin: 0 auto 24px; }
  h1 {
    font-family: "Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
    font-weight: 400;
    font-size: clamp(2.6rem, 12vw, 3.6rem);
    line-height: 1.15;
    margin: 0 0 36px;
  }
  p.sub { margin: 0 0 36px; font-style: italic; }
  a.open {
    display: block;
    background: var(--green);
    color: var(--cream);
    text-decoration: none;
    padding: 16px 20px;
    border-radius: 999px;
    font-size: 1.05rem;
  }
  a.open:focus-visible { outline: 3px solid var(--green-deep); outline-offset: 3px; }
  .tip {
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid rgba(77, 109, 64, 0.3);
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .tip strong { font-weight: bold; }
</style>
